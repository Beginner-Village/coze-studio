name: Backend Test

on:
  pull_request:
    branches: ['main']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit Tests (space packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run unit tests
        working-directory: backend
        run: go test -short -timeout 5m ./application/space/...

      - name: Coverage report
        working-directory: backend
        run: |
          go test -short -coverprofile=cover.out -timeout 5m ./application/space/...
          go tool cover -func=cover.out | tail -1

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: space-coverage
          path: backend/cover.out
          retention-days: 7

  integration-test:
    name: Integration Tests (testcontainers MySQL)
    runs-on: ubuntu-latest
    needs: unit-test
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run integration tests
        working-directory: backend
        run: go test -tags integration -timeout 15m ./test/integration/...
