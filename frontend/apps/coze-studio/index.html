<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>猎鹰智能体平台</title>
  </head>
  <script>
    if (typeof Promise.withResolvers === 'undefined') {
      Promise.withResolvers = function () {
        var resolve, reject;
        var promise = new Promise(function (res, rej) { resolve = res; reject = rej; });
        return { promise: promise, resolve: resolve, reject: reject };
      };
    }
    (function(){
      var fix=function(){ if(document.title && document.title.indexOf('扣子')>=0){ document.title='猎鹰智能体平台'; } };
      var el=document.querySelector('title');
      if(el && window.MutationObserver){ new MutationObserver(fix).observe(el,{childList:true,subtree:true,characterData:true}); }
      setInterval(fix,400); fix();
    })();
  </script>
  <script src="/config.js"></script>
  <body>
    <div id="root"></div>
  </body>
</html>
